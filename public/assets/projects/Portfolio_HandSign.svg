<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#0D0820"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#ffffff08" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#ffffff08" stroke-width="1"/>

  <!-- Glow drawing trail — signature curve -->
  <path d="M 100 280 C 140 220, 180 320, 220 240 S 300 160, 340 200 S 420 280, 460 230 S 510 180, 530 200"
        stroke="#C084FC" stroke-width="3" fill="none" opacity="0.9" filter="url(#softglow)"/>
  <path d="M 100 280 C 140 220, 180 320, 220 240 S 300 160, 340 200 S 420 280, 460 230 S 510 180, 530 200"
        stroke="#E879F9" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Sparkle particles -->
  <circle cx="220" cy="240" r="3" fill="#F0ABFC" opacity="0.9" filter="url(#glow)"/>
  <circle cx="340" cy="200" r="2.5" fill="#E879F9" opacity="0.8" filter="url(#glow)"/>
  <circle cx="460" cy="230" r="3.5" fill="#C084FC" opacity="0.9" filter="url(#glow)"/>
  <circle cx="150" cy="255" r="2" fill="#F0ABFC" opacity="0.6"/>
  <circle cx="390" cy="240" r="2" fill="#E879F9" opacity="0.6"/>
  <circle cx="510" cy="185" r="2" fill="#C084FC" opacity="0.7"/>

  <!-- Hand icon (simplified pinch gesture) -->
  <g transform="translate(290, 110) scale(0.9)" filter="url(#glow)">
    <!-- Palm -->
    <ellipse cx="20" cy="50" rx="22" ry="18" fill="none" stroke="#F0ABFC" stroke-width="2" opacity="0.9"/>
    <!-- Thumb -->
    <path d="M 0 42 C -10 35, -14 22, -8 12 S 2 8, 6 16 L 4 40" fill="none" stroke="#F0ABFC" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Index finger (pointing) -->
    <path d="M 8 34 C 6 20, 8 4, 12 -4 S 20 -4, 20 8 L 18 34" fill="none" stroke="#E879F9" stroke-width="2.5" stroke-linecap="round" opacity="1"/>
    <!-- Middle finger -->
    <path d="M 20 34 C 20 18, 22 4, 26 -2 S 33 0, 32 12 L 30 34" fill="none" stroke="#F0ABFC" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Ring finger (folded) -->
    <path d="M 30 34 C 32 24, 34 16, 34 22 L 34 34" fill="none" stroke="#F0ABFC" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <!-- Pinky (folded) -->
    <path d="M 36 36 C 38 28, 40 22, 40 28 L 40 38" fill="none" stroke="#F0ABFC" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <!-- Pinch dot at fingertip -->
    <circle cx="12" cy="-4" r="4" fill="#E879F9" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Label -->
  <text x="300" y="358" text-anchor="middle" font-family="'Fredoka One', 'Nunito', sans-serif" font-size="18" fill="#E9D5FF" opacity="0.9" letter-spacing="2">AIR SIGNATURE</text>
  <text x="300" y="378" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#A78BFA" opacity="0.7" letter-spacing="3">MEDIAPIPE · HAND GESTURE</text>
</svg>
